<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Yukariee, first-year BSIT student, building, learning, figuring things out</title>
  <desc id="d">A dark banner with a floor plan on the right. A lime-green route leaves a room, follows the corridor, and ends at a marker labeled you are here.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .route { stroke-dasharray: 1; stroke-dashoffset: 0; }
    .pin { opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .route { stroke-dashoffset: 1; animation: draw 2.4s cubic-bezier(.5,0,.2,1) .4s forwards; }
      .pin { opacity: 0; animation: show .4s ease 2.6s forwards; }
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes show { to { opacity: 1; } }
  </style>

  <rect width="900" height="260" rx="14" fill="#0d120e"/>

  <!-- floor plan -->
  <g fill="none" stroke="#34423a" stroke-width="2" stroke-linecap="square">
    <rect x="480" y="30" width="390" height="200"/>
    <path d="M480 100H510M530 100H600M620 100H690M710 100H795M815 100H870"/>
    <path d="M480 140H590M610 140H690M710 140H790M810 140H870"/>
    <path d="M560 30V100M650 30V100M740 30V100"/>
    <path d="M570 140V230M670 140V230M760 140V230"/>
  </g>
  <!-- stairs -->
  <g stroke="#34423a" stroke-width="2">
    <path d="M496 168H554M496 178H554M496 188H554M496 198H554M496 208H554"/>
  </g>

  <!-- route -->
  <path class="route" pathLength="1" d="M520 64V120H800V190" fill="none" stroke="#b8f23c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="520" cy="64" r="5" fill="#0d120e" stroke="#b8f23c" stroke-width="2"/>
  <g class="pin">
    <circle cx="800" cy="190" r="13" fill="#b8f23c" fill-opacity=".16"/>
    <circle cx="800" cy="190" r="6" fill="#b8f23c"/>
    <text class="mono" x="815" y="219" font-size="11" fill="#8a9a8f" text-anchor="middle">you are here</text>
  </g>

  <!-- text -->
  <text class="mono" x="40" y="118" font-size="52" font-weight="700" fill="#eaf0ea">Yukariee</text>
  <text class="mono" x="42" y="152" font-size="15" fill="#b8f23c">first-year BSIT student</text>
  <text class="mono" x="42" y="182" font-size="14" fill="#8a9a8f">building, learning, figuring things out</text>
</svg>
